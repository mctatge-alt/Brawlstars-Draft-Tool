:" ","marks":[],"data":{}},{"nodeType":"text","value":"SUSHI SNACK","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Nori eats up to 3 fish to heal himself for 1000 per fish. Cooldown: 12 seconds.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget 2:","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}},{"nodeType":"text","value":"GONNA NEED A BIGGER NET","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Aim a fishing net that roots the first Brawler hit for 1.25 sec and deals 800 damage. Cooldown: 20 seconds.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power 1: BIG HAUL","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Nori catches 3 fish when his Super hits enemy Brawlers.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power 2: HIS MOTHER’S SON","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Nori gains +20% speed for 1 sec whenever he hits an enemy with his Main Attack.","marks":[],"data":{}}]}]}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Wendy - Mythic - Support","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"A smart scientist, with a nostalgic soul. After years working in shady corporate laboratories, she left to build Windstock and help the planet, not harm it!","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Trait:","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" This Brawler can walk over Water AND Charges Super when taking shield damage.","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Attack: BLOW DRYER","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Wendy fires a blast dealing 2400 damage and giving herself 1386 shield. When hitting a teammate, Wendy gives them 2000 shield.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super: PLANET PROTECTOR","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Wendy deploys a shield generator that absorbs 75% of damage taken by Wendy and her teammates within its range.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget 1: WIND-POWERED","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Wendy’s platform gives her a boost and she jumps a short distance. Cooldown: 15 seconds.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget 2: GREEN GRENADE","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Wendy launches a wind grenade that slows all enemies hit and stops them healing momentarily. Cooldown: 15 seconds.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power 1: SLOWING SHIELD","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Enemies in Wendy’s shield generator are slowed.","marks":[],"data":{}}]}]}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power 2: SOLAR SHIELD","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Wendy’s shield generator gains an additional 2000 health.","marks":[],"data":{}}]}]}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"","marks":[],"data":{}}]}]}}},{"__typename":"TextBlock","title":"NEW Hypercharges","text":{"json":{"nodeType":"document","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"(trimmed)","marks":[],"data":{}}]}]}}},{"__typename":"TextBlock","title":"NEW Buffies","text":{"json":{"nodeType":"document","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"(trimmed)","marks":[],"data":{}}]}]}}},{"__typename":"TextBlock","title":"Seasons & Skins","text":{"json":{"nodeType":"document","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"(trimmed)","marks":[],"data":{}}]}]}}},{"__typename":"TextBlock","title":"Balance Changes","text":{"json":{"nodeType":"document","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"A general note for Brawlers receiving changes to their main attack damage: unless otherwise noted, they keep the same number of attacks to charge their Supers, as before.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Buffs","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Piper","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Health increased from 2500 to 2800","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack max damage increased from 1700 to 1800","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nPiper has been outshone by other marksmen for some time. To give her more power, extra health will help with trading, and Main attack damage will give her a wider scope of Brawlers she can quickly take down.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Mandy","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack damage increased from 1300 to 1400","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power - Hard Candy: Shield increased from 40% to 50%","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Similar to Piper, Mandy has fallen out of consideration when choosing marksmen after her Super/Hyper charge damage changes. We don't want to have her one shotting every squishy Brawler that spawns in, but we do want to allow her to have more damage when competing with other marksmen.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Gale","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super damage increased from 600 to 800","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nGale should be shining in such an aggressive meta but his overall strength is a bit too low for him to be a desirable pick. Extra damage to his Super should allow him to pressure aggressive Brawlers and take over the map more.\n\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"\nTara","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack reload speed decreased from 2000 to 1800","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nTara's core kit is still incredibly powerful but she lacks the consistency to shine, so we want to give her a bit more uptime on her damage to allow for more control and pressure.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nShelly","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power - Shell Shock: Slow changed from 350 to 55%","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Fast Forward: Cooldown decreased from 20s to 16s","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nSimilar to Gale, Shelly is a fantastic counter to aggressive metas but is falling a bit short in her ability to overcome such potent aggression. To give her a bit more pressure and mobility we're giving her more frequency in her dashing and more control with Shell Shock.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nDynamike","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Reload speed reduced from 1600 to 1400","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nAlongside Marksman, throwers are struggling in an aggression heavy meta. With these changes Mike will have more pressure and control on the map.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Larry & Lawrie","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super damage increased from 150 to 200","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super - Lawrie HP increased from 3000 to 3300","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nSimilar to Mike we want some extra power in throwers, for Larry we want to give his Twin some extra oomph with more damage and survivability to let him exert more pressure once he's ramped into his Super.\n\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"\nSprout","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack reload speed reduced from 1700 to 1500","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack damage increased from 1040 to 1100","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nSprout needs some more consistency and baseline damage to help it shine more when the opportunity for picking it arises. More reload speed will help those threatening explosions rain in more often, and be more potent when landing them.\n\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"\nBarley","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super projectile speed increased from 1504 to 1700","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Hyper Super projectile speed increased from 2104 to 2300","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nBarley has got some decent use in modes like hotzone at the moment with the options of damage or healing, we feel the main thing holding him back at the moment is how quickly he can get his damage and control out so we're tuning up the projectile speeds of both his Super forms.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nJuju","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super - GriGri's HP increased from 3600 to 4000","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Juju's main attack is doing some great work, but Grigri is a bit too weak to be a competitive pet. The extra HP should help Grigri stand its ground and let Juju control the map much better.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Grey","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Grand Piano: Speed of Piano reduced from 2500 to 1500","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack damage increased from 1160 to 1280","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nGray's core kit is still great in specific team comp's but lacks the fire power to be used unless paired with another Brawler that can make full use of his portals. Some baseline damage and evening out the power of his gadgets should help him feel more consistent and versatile.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nSurge","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Movement Speed at Level 0 increased from 650 to 680","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Speed bonus from Level 1 decreased from 170 to 140","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Surge is often struggling to get out of his first stage so we're evening out a bit of the bonuses gained from stage one and putting them into stage zero to help with a bit more immediate power.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Starr Nova","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super - Main Attack damage increased from 1000 to 1100","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Health increased from 3700 to 4000","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power - Mystical Star Technique: Healing increased from 162 to 216","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Starr Nova is having a fairly tough time compared with other assassins with larger burst windows, as well as struggling to get meaningful trading in with a combination of short range and average HP. In addition, her Mystical Star Technique isn't hitting the bar in terms of value, so some extra healing should allow it to be a more competitive decision between the Star Powers.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Buzz","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super charge rate increased from 96 to 100","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Hyper charge rate increased from 25 to 30","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Assassins and aggression drive the meta, but nobody's invited Buzz out for fun. He's quite close to where we want him so some slight buffs to availability of Super and hyper will help him dive in more regularly.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Lou","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack projectile size increased from 50 to 60","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nLou's main attack is often difficult to get full value of. We don't want to touch too much of his power as he can be extremely oppressive when too strong so more reliability in him landing main attack should help him shine more without dominating the map.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Carl","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack damage increased from 740 to 820","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nCarl is Mr. Consistent, rarely weak or low impact but at the moment just not impactful enough to be a strong consideration when compared to the current cast of damage dealers and anti-tanks. Some extra baseline damage should help him shine more often.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nPearl","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack heat consumed when attacking reduced from 450 to 380","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Recent updates to Pearl's heat has made it more difficult for her Star Powers to shine, so we're reducing the baseline consumption of heat in base attack to give a bit more space for her to stay above the 80% threshold.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"R-T","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack(Eat Static) - Damage increased from 740 → 1240\n","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"After recent Bug fixes with R-T’s mark we can safely buff his Super damage back to it’s previous state!","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"\nNerfs","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Mortis","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget — Combo Spinner: Cooldown increased from 15s to 18s","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget — Combo Spinner: Bonus damage to low health enemies decreased from 50% to 30%","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget — Creature of the Night: Damage and healing reduced from 760 to 700","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nMortis is often the go-to assassin and has been for some time. He has incredibly high burst potential with his gadgets so these changes will bring that down, as well as the frequency he has access to them. With the reduction to Combo spinner's damage he should have less situations where he can fully take down a Brawler with only two main attacks and his Gadget.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nColette","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Na Ah: Cooldown increased from 17s to 22s","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power - Mass Tax: Damage reduction during Super lowered from 75% to 60%","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super charge rate reduced from 100 to 90","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nColette's become a strong pick in most modes and maps with her Buffies. Being a bit too versatile we want to tone down how often she has access to her Super, the extra survivability Mass Tax gives her, and the frequency she can use that potent charm. These changes should keep her strong, but less overwhelming.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nCrow","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack poison duration reduced from 4s to 3s","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack reload speed increased from 1400 to 1600","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack damage increased from 320 to 420","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Health reduced from 3000 to 2800","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Hypercharge - Main Attack returning damage reduced from -30% to -40%","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nCrow, similar to Colette, is incredibly safe in most modes and maps. To bring down his overall power we’re taking out some of his consistent poke damage and vision control with reducing the poison duration, making him more fragile with less HP, and reducing his damage uptime with reducing his reload speed. In addition, we feel his Hyper charge has a bit too much burst with the Buffies so we’re pulling back a bit of the bonus damage.","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"\n\n\nLeon","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Lollipop Drop: Health reduced from 1500 to 1000","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Leon has been a stalwart of the meta since his Buffies, with Lollipop drop being at the forefront of it. Often used in situations the rest of his kit isn't ideal just for the potent power attached to the Gadget. Bringing down the health of this should make it much easier to deal with and lower its prevalence across the game.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Chester","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super explosion damage reduced from 1880 to 1600","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Hyper Super explosion damage reduced from 1880 to 1600","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Candy Beans: Damage boost reduced from 25% to 20%","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Candy Beans: Reload speed reduced from 200 to 150\n","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Chester is incredibly versatile and safe. He's an ideal counter to much of the current meta so we don't want to be too heavy handed on him as the meta shifting will likely also means he loses some of his value, but we do want to tone down some of the potency he has when rolling high on his Candy beans Gadget, as well as the burst damage he has attached to his wall breaking supers.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nEdgar","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Let's Fly: Cooldown increased from 14s to 18s","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power - Fisticuffs: Healing from take down reduced from 30% to 20%","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Hyper charge rate reduced from 40 to 33","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"With his updated Let's Fly Gadget, and Buffies Edgar can completely roll over squishy team comps and leave fairly unscathed. We want to lower the frequency that he can jump in with Let's fly, as well as how healthy he's able to stay when jumping in for a pick on squishy Brawlers. These should make picking when you jump in more meaningful and less frequent while still powerful. In addition, his Hyper Charge is extremely powerful but comes up too often for how much strength it has.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Mina","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack 3 damage reduced from 2000 to 1800","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Windmill: Duration reduced from 1.5s to 1s","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Mina is incredibly difficult to use which we love, she's a high skill high reward Brawler. However we felt that her final hit of the main attack was too strong especially when paired with a well timed Super to often leave the opponent unable to react. In addition windmill is allowing her to be a bit too reliable in modes that would normally not favor her like hotzone so we'll be cutting back some of it's power.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Ruffs","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Hyper charge rate reduced from 40 to 35","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nRuffs similar to Chester is a Brawler that is reaping the benefits of a meta that favours him. As such we don't want to take too much power out of his kit with the main aim being lowering how often he can hand out free Hyper Charges.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Meeple","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Rage Quit: Cooldown increased from 18s to 20s","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Rage Quit: Radius decreased from 2000 to 1600","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Meeple has crept up as a great counter to an aggressive meta, largely through their space control and the safety that Rage Quit grants them when an assassin dives in on them. These changes will keep much of that power in their kit but tone down how well they're countering many of the assassins.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Shade","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Hypercharge rate reduced from 40 to 34","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Shade is another Brawler we have seen step up a ton with the last round of balancing. He's in a fairly healthy spot being a great late pick in draft and Super potent in specific maps and modes, but he's getting his hyper a bit too easily at the moment and we want to slow down how often he gets it.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nLumi","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Grim and Frostbitten: Duration reduced from 3.9s to 3s","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Grim and Frostbitten: Size decreased from 700 to 600","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nIn the right hands Lumi is one of, if not the strongest Brawler around. We want to make sure she doesn't end up in a position of being unusable again, but want to lower the amount of space control and pressure she can exert across the map with her Grim and Frostbitten Gadget","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nNajia","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super charge from Super reduced from 80 to 50","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Hypercharge - Health of snakes reduced from 2000 to 1500","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Najia is overall in a much much healthier spot as of late but could still use some tuning down around her Super and hyper. With these changes she’ll have a much harder time looping supers, and her Hypercharge snakes should be considerably more manageable.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"Pierce","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Bottomless Mags: Cooldown increased from 18s to 22s","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - You Only Brawl Twice: Cooldown increased from 12s to 18s","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\n","marks":[],"data":{}},{"nodeType":"text","value":"Pierce is still the go to Marksman in 90% of cases due to a combination of incredible safety against aggressive Brawlers , and a huge amount of pressure with looping his last shots. We want to keep him feeling like a great Marksman and reward amazing aim, but lower that safety and reliability of looping last shots by lowering how available they both are.","marks":[{"type":"italic"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nBolt","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack - Max damage reduced from 900 → 760","marks":[{"type":"italic"}],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super - Damage increased from 550 → 700","marks":[{"type":"italic"}],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super Charge rate from Super → Reduced from 100 → 90","marks":[{"type":"italic"}],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power - Unstoppaball - Bolt is immune to crowd control and gains 15% top speed during Super → Bolt is immune to crowd control for 1 seconds after activating his Super.","marks":[{"type":"italic"}],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nBolt is zooming around at the speed of sound, but is doing a bit too much damage and too difficult to slow down when paired with the Unstoppaball starpower. We’re going to shrink the window of Unstoppaball’s CC immunity, as well as move some of his main attack damage into the Super trail to make his immediate damage when rolling into a map less snowbally.\n","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"\n","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Changes","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Spike","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Main Attack damage increased from 490 to 540","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super charge rate decreased from 106 to 90 (now 4 attacks instead of 3)","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power - Fertilize: Healing increased from 50% to 75%","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nGriff","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Coin Shower: Damage increased from 200 to 300","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Coin Shower: Cooldown reduced from 20s to 15s","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Coin Shower - Duration increased from 5s to 6s","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gadget - Piggy Bank: Max explosion range reduced from 1200 to 1000","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Star Power - Keep the Change: Now shoots a 4th salvo in the same amount of time as 3","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"\nDamian","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super: Speakers now break after bouncing an enemy Brawler","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Super: Damage from speakers increased from 600 to 800","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Hypercharge: Damage increased from 400 to 600\n","marks":[],"data":{}}]}]}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Brawl Arena Only","marks":[{"type":"bold"}],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Damian","marks":[{"type":"underline"},{"type":"bold"}],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Damage scaling reduced from 3 to 1","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Health scaling reduced from 750 to 500","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":
